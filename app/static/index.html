<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stripe AI Sales Agent</title>
<style>
  :root {
    --bg: #0a0d1c; --panel: #12172b; --panel-2: #181e36; --line: #262d4a;
    --text: #e7e9f3; --muted: #8b92b3; --accent: #635bff; --accent-2: #00d4ff;
    --ok: #3ecf8e; --warn: #ffb347; --err: #ff5c7a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header h1 span { color: var(--accent-2); font-weight: 500; }
  .spacer { flex: 1; }
  label { color: var(--muted); font-size: 13px; }
  select, button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 14px;
  }
  select { min-width: 260px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; overflow-y: auto; padding: 24px 0; }
  .thread { max-width: 820px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 12px; }
  .msg .who {
    flex: 0 0 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: #fff; background: var(--line);
  }
  .msg.agent .who { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .msg .bubble {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; white-space: pre-wrap; word-wrap: break-word; max-width: 100%;
  }
  .msg.customer .bubble { background: var(--panel-2); }
  .msg .bubble.error { border-color: var(--err); color: #ffd3dc; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  .activity { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .activity:empty { display: none; }
  .act { display: flex; align-items: baseline; gap: 8px; font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); }
  .act .k { color: var(--accent-2); flex: 0 0 auto; }
  .act .k::before { content: "▸ "; color: var(--line); }
  .act.blocked .k { color: var(--warn); }
  .act.error .k { color: var(--err); }
  .act .args { color: var(--text); opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52ch; }
  .act .r { flex: 0 0 auto; }
  .act .r.cached::after { content: " · cached"; color: var(--ok); }
  .act.sub { padding-left: 18px; }
  .act.sub .k { color: var(--muted); }
  .sources { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .sources a { font-size: 12px; color: var(--accent-2); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .sources a:hover { border-color: var(--accent-2); }
  .handoff { margin-top: 10px; border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; background: rgba(99,91,255,.08); }
  .handoff .t { font-weight: 600; margin-bottom: 4px; }
  .handoff .d { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .handoff .btns { display: flex; gap: 8px; }
  .handoff.resolved { opacity: .6; }
  .status { color: var(--muted); font-size: 13px; font-style: italic; }
  .status::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: var(--accent-2); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  footer { padding: 14px 20px 18px; background: var(--panel); border-top: 1px solid var(--line); }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  textarea {
    flex: 1; resize: none; min-height: 48px; max-height: 160px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: inherit;
  }
  textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .hint { max-width: 820px; margin: 8px auto 0; color: var(--muted); font-size: 12px; display: flex; gap: 16px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty strong { color: var(--text); display: block; font-size: 18px; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <h1>Stripe <span>AI Sales Agent</span></h1>
  <div class="spacer"></div>
  <label for="customer">Signed in as</label>
  <select id="customer"><option value="">Loading customers…</option></select>
  <button id="new-chat" title="Start a fresh conversation">New conversation</button>
</header>

<main><div class="thread" id="thread"></div></main>

<footer>
  <div class="composer">
    <textarea id="input" placeholder="Ask about Stripe products, pricing, or what fits your business…" rows="1"></textarea>
    <button class="primary" id="send">Send</button>
  </div>
  <div class="hint">
    <span>Enter to send · Shift+Enter for a new line</span>
    <span id="session-label"></span>
  </div>
</footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const thread = $("thread"), input = $("input"), send = $("send"), customerSel = $("customer");

  // --- session -------------------------------------------------------------
  const state = { sessionId: null, customerId: null, busy: false };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };
  const newSessionId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));

  function startSession(customerId, { fresh } = { fresh: false }) {
    state.customerId = customerId || null;
    state.sessionId = fresh ? newSessionId() : (store.get("session:" + (customerId || "prospect")) || newSessionId());
    store.set("session:" + (customerId || "prospect"), state.sessionId);
    store.set("customer", customerId || "");
    $("session-label").textContent = "session " + state.sessionId.slice(0, 8);
    thread.innerHTML = "";
    empty();
  }

  function empty() {
    const name = customerSel.selectedOptions[0]?.textContent || "there";
    const div = document.createElement("div");
    div.className = "empty";
    div.innerHTML = `<strong>Hi ${escapeHtml(name.split(" — ")[0])}.</strong>Ask me anything about Stripe — what a product does, what it costs, or what would fit your business.`;
    thread.appendChild(div);
  }

  // --- rendering -----------------------------------------------------------
  function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function scroll() { thread.parentElement.scrollTop = thread.parentElement.scrollHeight; }

  function addMessage(role, text) {
    document.querySelector(".empty")?.remove();
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    wrap.innerHTML = `<div class="who">${role === "agent" ? "S" : "You"}</div><div><div class="activity"></div><div class="bubble"></div><div class="handoff-slot"></div><div class="sources"></div><div class="meta"></div></div>`;
    wrap.querySelector(".bubble").textContent = text || "";
    thread.appendChild(wrap);
    scroll();
    return wrap;
  }

  function addActivity(wrap, kind, key, args, result) {
    const row = document.createElement("div");
    row.className = "act " + kind;
    row.innerHTML = `<span class="k"></span><span class="args"></span><span class="r"></span>`;
    row.querySelector(".k").textContent = key;
    row.querySelector(".args").textContent = args || "";
    if (result) { row.querySelector(".r").textContent = result.text || ""; if (result.cached) row.querySelector(".r").classList.add("cached"); }
    wrap.querySelector(".activity").appendChild(row);
    scroll();
    return row;
  }
  function shortArgs(raw) {
    try { const o = JSON.parse(raw || "{}"); const s = Object.entries(o).map(([k, v]) => `${k}: ${JSON.stringify(v)}`).join(", "); return s ? `(${s})` : "()"; }
    catch { return raw || ""; }
  }

  function setStatus(wrap, text) {
    const meta = wrap.querySelector(".meta");
    meta.innerHTML = text ? `<span class="status">${escapeHtml(text)}</span>` : "";
  }

  function finish(wrap, done) {
    const sources = wrap.querySelector(".sources");
    for (const s of done.sources || []) {
      const a = document.createElement("a");
      a.href = s.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = s.title || s.url;
      sources.appendChild(a);
    }
    const meta = wrap.querySelector(".meta");
    const u = done.usage || {};
    const cache = (u.cache_hit_tokens + u.cache_miss_tokens) ? Math.round(100 * u.cache_hit_tokens / (u.cache_hit_tokens + u.cache_miss_tokens)) + "% cache hit" : "";
    meta.innerHTML = [done.latency_ms != null ? (done.latency_ms / 1000).toFixed(1) + "s" : "", u.prompt_tokens != null ? `${u.prompt_tokens}→${u.completion_tokens} tokens` : "", cache]
      .concat(done.tool_rounds ? [`${done.tool_rounds} tool round${done.tool_rounds > 1 ? "s" : ""}`] : [])
      .filter(Boolean).map((t) => `<span>${escapeHtml(t)}</span>`).join("");
  }

  // --- handoff confirmation ----------------------------------------------
  function offerHandoff(wrap, pending) {
    const slot = wrap.querySelector(".handoff-slot");
    const card = document.createElement("div");
    card.className = "handoff";
    card.innerHTML = `<div class="t"></div><div class="d"></div><div class="btns"><button class="primary" data-accept="true">Yes, connect me</button><button data-accept="false">No, keep going</button></div>`;
    card.querySelector(".t").textContent = `Bring in ${pending.team}?`;
    card.querySelector(".d").textContent = pending.handles ? `${pending.team} handles ${pending.handles}.` : "";
    for (const b of card.querySelectorAll("button")) {
      b.addEventListener("click", async () => {
        if (state.busy) return;
        const accept = b.dataset.accept === "true";
        for (const x of card.querySelectorAll("button")) x.disabled = true;
        const ok = await resumeAfterHandoff(accept, pending.handoff_id);
        if (ok) {
          card.classList.add("resolved");
          card.querySelector(".d").textContent = accept ? "Confirmed — connecting you." : "Declined — continuing here.";
        } else {
          for (const x of card.querySelectorAll("button")) x.disabled = false;
        }
      });
    }
    slot.appendChild(card);
    scroll();
  }

  async function resumeAfterHandoff(accept, handoffId) {
    return withReply((reply) => fetch("/sales-agent/confirm-handoff", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: state.sessionId, accept, handoff_id: handoffId }),
    }).then((res) => streamInto(res, reply)));
  }

  // Run one request that streams into a fresh agent bubble; returns true when the stream completed.
  async function withReply(run) {
    state.busy = true; send.disabled = true;
    const reply = addMessage("agent", "");
    setStatus(reply, "thinking");
    try {
      await run(reply);
      return true;
    } catch (err) {
      const bubble = reply.querySelector(".bubble");
      bubble.textContent = "I couldn't reach the agent. Please check the server and try again.";
      bubble.classList.add("error"); setStatus(reply, "");
      return false;
    } finally {
      state.busy = false; send.disabled = false; input.focus();
    }
  }

  async function streamInto(res, reply) {
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
    await consumeStream(res, reply);
  }

  // --- talking to the agent ------------------------------------------------
  async function ask(text) {
    if (state.busy || !text.trim()) return;
    input.value = ""; autosize();
    addMessage("customer", text);
    await withReply((reply) => fetch("/sales-agent/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: state.sessionId, customer_id: state.customerId, message: text }),
    }).then((res) => streamInto(res, reply)));
  }

  async function consumeStream(res, reply) {
    const bubble = reply.querySelector(".bubble");
    const pending = {};
    const reader = res.body.getReader(), decoder = new TextDecoder();
    {
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf("\n\n")) >= 0) {
          const block = buffer.slice(0, idx); buffer = buffer.slice(idx + 2);
          let event = "message", data = {};
          for (const line of block.split("\n")) {
            if (line.startsWith("event: ")) event = line.slice(7);
            else if (line.startsWith("data: ")) { try { data = JSON.parse(line.slice(6)); } catch {} }
          }
          if (event === "thinking") setStatus(reply, "thinking");
          else if (event === "tool_call") { pending[data.call_id] = addActivity(reply, "tool", data.name, shortArgs(data.arguments)); setStatus(reply, data.name === "Skill" ? "loading skill" : "looking things up"); }
          else if (event === "skill_loaded") { const row = pending[data.call_id]; if (row) { row.querySelector(".k").textContent = "Skill"; row.querySelector(".args").textContent = data.name; row.querySelector(".r").textContent = "loaded"; } }
          else if (event === "tool_result") { const row = pending[data.call_id]; if (row) { const r = row.querySelector(".r"); r.textContent = data.is_error ? "error" : `${data.chars} chars`; if (data.cached) r.classList.add("cached"); if (data.is_error) row.classList.add("error"); } }
          else if (event === "hook_blocked") { const row = pending[data.call_id]; if (row) { row.classList.add("blocked"); row.querySelector(".r").textContent = `blocked by ${data.hook}`; } }
          else if (event === "subagent_started") { addActivity(reply, "sub", data.name, "started", { text: "" }); setStatus(reply, `${data.name} in progress`); }
          else if (event === "subagent_tool_call") { addActivity(reply, "sub", `${data.name} › ${data.tool}`, shortArgs(data.arguments)); }
          else if (event === "subagent_finished") { addActivity(reply, "sub", data.name, `${data.tool_calls} tool call${data.tool_calls === 1 ? "" : "s"}`, { text: data.gave_up ? "no brief (budget reached)" : data.stopped_by_cap ? "brief (budget reached)" : "brief" }); }
          else if (event === "text_delta") { if (!bubble.textContent) setStatus(reply, ""); bubble.textContent += data.text || ""; scroll(); }
          else if (event === "handoff_pending") { setStatus(reply, ""); }
          else if (event === "done") { if (!bubble.textContent && data.reply) bubble.textContent = data.reply; finish(reply, data); if (data.pending_handoff) offerHandoff(reply, data.pending_handoff); }
          else if (event === "error") { bubble.textContent = data.reply || "Something went wrong."; bubble.classList.add("error"); setStatus(reply, ""); }
        }
      }
    }
  }

  // --- wiring --------------------------------------------------------------
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
  send.addEventListener("click", () => ask(input.value));
  $("new-chat").addEventListener("click", () => startSession(customerSel.value, { fresh: true }));
  customerSel.addEventListener("change", () => startSession(customerSel.value));

  fetch("/api/customers").then((r) => r.json()).then((rows) => {
    customerSel.innerHTML = "";
    for (const c of rows) {
      const o = document.createElement("option");
      o.value = c.customer_id;
      o.textContent = `${c.customer_name} — ${c.industry || ""}`.replace(/ — $/, "");
      customerSel.appendChild(o);
    }
    const remembered = store.get("customer");
    if (remembered && rows.some((c) => c.customer_id === remembered)) customerSel.value = remembered;
    startSession(customerSel.value);
    input.focus();
  }).catch(() => { customerSel.innerHTML = '<option value="">(customers unavailable)</option>'; startSession(null); });
})();
</script>
</body>
</html>
