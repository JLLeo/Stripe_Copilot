- id: mm-bank-terminals-objection
  split: test
  customer: seed:C005
  working_memory:
  - customer: Lots of our online shoppers are in the US and Europe. Can they pay in their own currencies?
    skills: [payments]
    agent: >-
      Yes. Stripe accepts 135+ currencies, and Adaptive Pricing can show each shopper prices in their
      local currency automatically while you're paid out in Canadian dollars.
  - customer: >-
      Do we have to charge GST on those foreign orders?
    skills: [tax]
    agent: >-
      Stripe Tax can calculate GST, HST and foreign VAT where you're registered. Whether you need to
      collect on a given foreign order is a question for a tax specialist, and I can connect you
      with one.
  message: >-
    Good. For our two Toronto stores, though, we already rent card terminals from our bank and switching
