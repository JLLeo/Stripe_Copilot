- id: mm-trial-signups-stolen-cards
  split: dev
  customer: seed:C026
  working_memory:
  - customer: What does Stripe Billing cost on top of card processing?
    skills: [pricing_conversation]
    agent: >-
      Billing's pay-as-you-go price is 0.7% of billing volume on top of standard processing fees, with
      no setup fee, and there's a monthly plan on a one-year contract if that suits you better.
  message: >-
    Thanks. Two problems, though. People are signing up for our free trial with stolen cards just to
    burn through the free credits, and we want to change the trial so it takes a card up front and
    starts charging automatically when it ends. How do we handle both?
  skills: {required: [fraud_protection, billing], acceptable: []}
  tools: {required: ["search_knowledge|research"], acceptable: []}
  first_action: [skill:fraud_protection, skill:billing]
  note: >-
    Trial sign-ups on stolen cards are fraud_protection and a card-up-front trial that converts
    automatically is billing; pricing_conversation is in context.

- id: mm-fraud-vendor-and-disputes
  split: test
  customer: seed:C001
  working_memory:
  - customer: Can our sellers choose between daily and weekly payouts?
    skills: [connect]
    agent: >-
      Yes. Each seller's connected account can have its own payout schedule, daily, weekly, monthly or
      manual, so sellers can be paid on the cadence that suits them.
  - customer: >-
      And can sellers see their upcoming payouts somewhere without asking us?
    skills: []
    agent: >-
      Yes. Express accounts come with a Stripe-hosted dashboard showing each seller's balance and
      upcoming payouts, or you can embed that view in your own site with Connect embedded
      components.
  message: >-
    Good. On fraud, honestly, we already pay a separate fraud-screening vendor and I don't see why we'd
    move to Radar. And separately, buyers have started disputing orders that were clearly delivered.
    What can we do about those?
  skills: {required: [objection_handling, fraud_protection], acceptable: []}
  tools: {required: ["search_knowledge|research"], acceptable: [remember]}
  first_action: [skill:objection_handling, skill:fraud_protection]
  note: >-
    Resisting a move from an existing fraud vendor is an objection and disputes on delivered orders are
    fraud_protection; connect is in context, and the vendor already in place is a durable fact to
    remember.

- id: mm-listing-fee-and-vendor-payouts
  split: dev
  customer: seed:C010
  working_memory:
  - customer: Can we see which vendors sell the most each month without exporting spreadsheets?
    skills: [data]
    agent: >-
      Yes. Sigma lets you query your payments with SQL in the Dashboard, and if each payment is tagged
      with its vendor, a monthly sales-by-vendor report is a short saved query.
  - customer: >-
      Can that report run on its own every month?
    skills: []
    agent: >-
      Yes. Sigma queries can be scheduled, so the report runs each month and the results are ready
      without anyone rerunning it.
  message: >-
    Good. Two bigger changes we're planning. We want to charge every vendor a $29 monthly listing fee,
    and we want to stop paying vendors by hand and have their share sent to them each week after our
    commission. How would both work?
  skills: {required: [billing, connect], acceptable: []}
  tools: {required: ["search_knowledge|research"], acceptable: [remember]}
  first_action: [skill:billing, skill:connect]
  note: >-
    A monthly listing fee is a subscription, so billing, and paying vendors their share is connect;
    data is in context, and the planned changes are worth remembering.

