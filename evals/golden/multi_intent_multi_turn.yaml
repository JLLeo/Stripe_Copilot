    the online ones in the same reports?
  skills: {required: [objection_handling, terminal], acceptable: []}
  tools: {required: [search_knowledge], acceptable: [remember]}
  first_action: [skill:objection_handling, skill:terminal]
  note: >-
    Reluctance to leave the bank's rented terminals is an objection and unified in-store and online
    reporting is terminal; payments is in context, and the bank terminals already in place are a durable
    fact to remember.

