- id: mm-bookkeeper-quickbooks
  split: dev
  customer: prospect
  working_memory:
  - customer: Hi, we're a small design agency looking at better ways to bill our clients.
    skills: [discovery]
    agent: >-
      Nice to meet you! So I can point you to the right setup, how do you bill clients today, and roughly
      how much do you invoice in a month?
  - customer: >-
      About 25 clients on monthly retainers, around $30K a month in total. Do we have to charge sales tax
      on design services?
    skills: [tax]
    agent: >-
      Stripe Tax can calculate and collect sales tax where it applies and alert you as you near a
      registration threshold. Whether design services are taxable in your state is a question for a tax
      specialist, and I can connect you with one.
  - customer: >-
      Makes sense. Once a client pays, how quickly would the money reach our bank?
    skills: [payments]
    agent: >-
      In the US, card payments usually reach your bank two business days after the charge on
      Stripe's standard payout schedule, with no setup or monthly fee for that.
  message: >-
    OK, thanks. Honestly, our bookkeeper thinks we should keep sending invoices from QuickBooks and that
    Stripe would just be one more tool. If we did switch, could Stripe send the retainer invoices every
    month and charge clients' cards automatically?
  skills: {required: [objection_handling, billing], acceptable: []}
  tools: {required: [capture_lead, search_knowledge], acceptable: []}
  first_action: [skill:objection_handling, skill:billing]
  note: >-
    The bookkeeper's preference for QuickBooks is an objection and recurring retainer invoices charged
    automatically are billing; discovery and tax are in context, and the current tool and the
    bookkeeper's view are lead facts.
