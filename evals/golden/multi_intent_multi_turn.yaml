# Golden Set — multi intent, multi-turn (#17).
# Two or more new asks in different areas, decided against a fixed earlier conversation: at least two
# required skills, none of them already loaded by the prior Working Memory. Some messages also touch an area already
# in context, which needs no second load. See evals/golden.py for the schema.

- id: mm-offtopic-then-leather
  split: dev
  customer: prospect
  working_memory:
  - customer: Can you help me fix a layout bug in my Shopify theme?
    skills: []
    agent: >-
      That's outside what I can help with, as I'm Stripe's AI sales assistant. If you're looking at how
      your shop takes payments, though, I'm glad to help with that.
  message: >-
    Ha, fair enough. Actually, yes. We make handmade leather bags, sell about $40k a month online, and
    we're thinking of leaving Shopify Payments. What would Stripe charge us per sale, and could we use
    the same account at the weekend craft fairs we do?
  skills: {required: [discovery, terminal], acceptable: [pricing_conversation, payments]}
  tools: {required: [capture_lead, get_pricing, search_knowledge], acceptable: []}
  first_action: [skill:discovery, skill:terminal]
  note: >-
    The off-topic opener loaded nothing, so this first business turn of a prospect needs discovery,
    whose body covers a public-price question, plus terminal for the craft fairs; pricing_conversation
    and payments are adjacent, the business and volume are lead facts, and the rate comes from
    get_pricing.

- id: mm-es-oxxo-boleto-impuestos
