      vuestros clientes?
  message: >-
    Facturamos unos 800.000 € al año, casi todo en España. Ahora queremos vender en México y Brasil.
    ¿Podemos aceptar OXXO y Boleto? ¿Y Stripe calcula los impuestos de cada país?
  skills: {required: [payments, tax], acceptable: []}
  tools: {required: [capture_lead, "search_knowledge|research"], acceptable: [request_handoff]}
  first_action: [skill:payments, skill:tax]
  note: >-
    OXXO and Boleto are local payment methods, so payments, and tax calculation in new countries is
    tax, asked as a capability; volume and target markets are lead facts, availability by country may
    need Solutions Engineering, and the reply is in Spanish.

