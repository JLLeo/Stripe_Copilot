- id: ms-buses-route-revenue
  split: dev
  customer: seed:C027
  message: >-
    We're putting contactless readers on all 400 of our buses next spring, and the board wants fare
    revenue by route in our data warehouse the morning after. Can Stripe cover both?
  skills: {required: [terminal, data], acceptable: []}
  tools: {required: ["search_knowledge|research"], acceptable: [request_handoff, remember]}
  first_action: [skill:terminal, skill:data]
  note: >-
    Readers on buses are terminal (a roll-out this size may go to a person) and revenue by route in
