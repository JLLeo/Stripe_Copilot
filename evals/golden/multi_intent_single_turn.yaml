    worth remembering.

- id: ms-course-platform-ramble
  split: test
  customer: seed:C019
  message: >-
    Right, this might be a long one. We run an online course platform out of Manchester: students
    pay a monthly subscription and get access to everything, and the instructors who make the courses
    get a share of what their courses earn. At the moment we work out each instructor's share in a
    spreadsheet at the end of the month and someone on the team does the bank transfers by hand,
    which is getting silly now we're past sixty instructors, a few of them in Ireland and Spain. On
    top of that, our accountant pointed out we've got a lot of students in the EU now and asked
    whether we're charging VAT on those subscriptions properly. I genuinely don't know. Oh, and
    plenty of students sign up for the yearly plan, then ask to switch to monthly halfway through,
    which we handle by refunding and re-subscribing them by hand. Can Stripe sort any of this out?
  skills: {required: [connect, tax, billing], acceptable: []}
  tools: {required: ["search_knowledge|research"], acceptable: [request_handoff, remember]}
  first_action: [skill:connect, skill:tax, skill:billing]
  note: >-
    Three asks in one long message: paying instructors (connect), VAT on EU subscriptions (tax;
    whether they charge it properly is tax advice, so a specialist may be offered), and plan
    switches with proration (billing).

- id: ms-klarna-vip-chargebacks
  split: dev
  customer: seed:C025
  message: >-
    We'd like to offer Klarna on our pricier VIP packages. Would that raise our chargeback exposure,
    and how does Radar treat those orders?
  skills: {required: [payments, fraud_protection], acceptable: []}
  tools: {required: ["search_knowledge|research"], acceptable: [get_my_profile]}
  first_action: [skill:payments, skill:fraud_protection]
  note: >-
    Adding a buy-now-pay-later method is payments, and chargeback exposure and Radar on those orders
    is fraud_protection, with no guaranteed dispute outcome; a cross-product answer from cited docs.

- id: ms-too-technical-currencies
  split: test
  customer: seed:C030
  message: >-
    Honestly, every Stripe guide I find is full of code and we don't have a developer, so I'm not
    sure Stripe is for us. And if we did go ahead, could buyers in Europe and Asia pay for our
    templates in their own currency?
  skills: {required: [objection_handling, payments], acceptable: []}
  tools: {required: ["search_knowledge|research"], acceptable: [get_my_profile]}
  first_action: [skill:objection_handling, skill:payments]
  note: >-
    "Too technical for us" is objection_handling (point to the no-code Payment Links they already
    use) and paying in local currency is payments (Adaptive Pricing); the no-code and currency facts
    need cited docs.
