- id: ms-card-testing-fraud-teams
  split: test
  customer: seed:C014
  message: >-
    Every time we drop a new item we get a wave of tiny card-testing payments. Would Radar for Fraud
    Teams rules catch that, and what does it cost per transaction?
  skills: {required: [fraud_protection, pricing_conversation], acceptable: []}
  tools: {required: [search_knowledge, get_pricing], acceptable: [get_my_profile]}
