      along with cards and Link.
  message: >-
    Some outside designers now want to sell their own planners in our store, and we'd keep 20% of
    each sale. Can those links handle paying them their share?
  skills: {required: [connect], acceptable: []}
  tools: {required: [search_knowledge], acceptable: [remember]}
  first_action: [skill:connect]
  note: >-
    Mentions the payment links already discussed, but paying outside designers their share after a
    20% cut is a marketplace flow, so connect, with the split-payment facts cited; the new commission
