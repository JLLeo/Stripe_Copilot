# Golden Set — single intent, multi-turn (#17).
# One new ask, decided against a fixed earlier conversation: at most one required skill, and never one the
# prior Working Memory already loaded. Several turns are follow-ups inside an area already in context and need no new
# skill at all. See evals/golden.py for the schema.

- id: sm-bot-then-bakery
  split: dev
  customer: prospect
  working_memory:
  - customer: Before anything else, am I talking to a real person or a bot?
    skills: []
    agent: >-
      I'm an AI assistant for Stripe's sales team. I can answer questions about Stripe and bring in a
      person whenever you'd like. What are you working on?
  message: >-
    Fair enough, a bot it is. We run three bakeries in Pittsburgh and want people to preorder cakes
    online and pick them up in store. Where would we even start?
  skills: {required: [discovery], acceptable: [payments]}
  tools: {required: [capture_lead], acceptable: [ask_customer]}
  first_action: [skill:discovery]
  note: >-
    The opener was a conduct question that loaded nothing, so this is the prospect's first business
    turn and needs discovery; online preorders touch payments lightly, and three bakeries wanting
    preorders are concrete lead facts.

- id: sm-applepay-on-top
  split: test
  customer: seed:C022
  working_memory:
