      your own rules, such as blocking or requesting 3D Secure for risky purchases during a launch.
  - customer: >-
      What does Radar for Fraud Teams cost?
    skills: [pricing_conversation]
    agent: >-
      On standard pricing, Radar for Fraud Teams is $0.02 per screened transaction, and standard
      Radar stays included at no extra cost.
  message: >-
    Our data team wants to study those spikes themselves. Can every purchase land in our BigQuery so
    they can join it with in-game events?
  skills: {required: [data], acceptable: []}
  tools: {required: [search_knowledge], acceptable: []}
  first_action: [skill:data]
  note: >-
    Landing purchases in their own warehouse to join with game events is Data Pipeline, so data;
    fraud_protection is already in context even though the spikes are the subject.

