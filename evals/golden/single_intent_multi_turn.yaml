    skills: [payments]
    agent: >-
      Turning on wallets is usually the quickest win. Checkout supports Apple Pay, Google Pay and Link,
      so mobile shoppers can pay without typing their card details.
  - customer: >-
      Would that work with the Checkout page we already have, or do we need to rebuild it?
    skills: []
    agent: >-
      It works with the page you have. Wallets are switched on in your payment method settings in
      the Dashboard, so there's nothing to rebuild.
  message: If we switch Apple Pay on, does it cost us anything on top of what we pay for cards now?
  skills: {required: [pricing_conversation], acceptable: []}
  tools: {required: [get_pricing], acceptable: []}
  first_action: [skill:pricing_conversation]
  note: >-
    Names Apple Pay, a payments topic already in context, but asks what it costs, so
    pricing_conversation, and the answer comes only from get_pricing.

- id: sm-designers-take-a-cut
