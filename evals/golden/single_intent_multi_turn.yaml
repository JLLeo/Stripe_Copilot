- id: sm-dunning-tool-rant
  split: test
  customer: seed:C002
  working_memory:
  - customer: We lose a lot of renewals to expired cards. What can Stripe do about it?
    skills: [billing]
    agent: >-
      Smart Retries reattempt failed renewals when they're most likely to succeed, and dunning emails
      plus the Customer Portal let customers update an expired card before the subscription lapses.
  - customer: >-
      How much of that lost revenue do companies like us usually get back?
    skills: []
    agent: >-
      It varies a lot by business, so I won't put a number on it. Your own recovery rate in the
      Dashboard today is the best baseline to compare against.
  message: >-
    Look, I'll be honest with you. We signed up for a separate dunning tool about two years ago after a
    rough quarter, it does its own retries and emails, support knows it inside out, finance built their
    dashboards on top of it, and every time someone suggests moving it I hear about how long the last
    migration took. So I'm not convinced switching that over to Stripe is worth the hassle, even if
    Smart Retries is as good as you say.
  skills: {required: [objection_handling], acceptable: []}
  tools: {required: [], acceptable: [remember, search_knowledge]}
  first_action: [skill:objection_handling]
  note: >-
    A long pushback against switching from an existing tool is objection_handling, with billing already
    in context; the method asks before asserting, so no tool is required, and remembering the standing
    objection or citing a fact are both fair.

