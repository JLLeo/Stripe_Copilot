- id: ss-fare-fixed-fee
  split: dev
  customer: seed:C027
  message: >-
    Most of our fares are $2.50, so a 30-cent fixed fee eats more than a tenth of every ride. Can
    you do something about the per-transaction fee for us?
  skills: {required: [pricing_conversation], acceptable: [objection_handling]}
  tools: {required: [request_handoff], acceptable: [get_my_profile, get_pricing]}
  first_action: [skill:pricing_conversation]
  note: >-
    A different fee structure is custom pricing, which the agent never promises; at $22.5M a year
    the handoff goes to Enterprise Sales; the fee complaint is a mild "too expensive" pushback, so
    objection_handling is adjacent.

- id: ss-dutch-belgian-methods
  split: test
  customer: seed:C005
  message: >-
    Lots of our shoppers in the Netherlands and Belgium drop off right at the payment step. Can we
    let them pay the way they normally do over there?
  skills: {required: [payments], acceptable: []}
  tools: {required: [search_knowledge], acceptable: [get_my_profile, request_handoff]}
  first_action: [skill:payments]
  note: >-
    Local payment methods for conversion (iDEAL, Bancontact), never named, are payments, and
    method availability must be cited rather than recalled; the regional-availability policy lets a
    careful agent offer Solutions Engineering for country validation.

- id: ss-donors-bank-account
  split: dev
  customer: seed:C007
  message: >-
    Donors keep asking if they can give straight from their bank account instead of using a card.
    Can we offer that on our donation page?
  skills: {required: [payments], acceptable: []}
  tools: {required: [search_knowledge], acceptable: [get_pricing, get_my_profile]}
  first_action: [skill:payments]
  note: >-
    Bank debits on their Payment Links page are payment-method coverage, so payments, with the
    setup cited; ACH's lower fee matters to a low-cost donation collector, so a price lookup is no
    error.

- id: ss-elements-pci-scope
  split: test
  customer: seed:C003
  message: >-
    We're replacing Checkout with Elements so the payment form sits inside our own app. Our auditor
    wants to know whether card numbers would then touch our servers, and which PCI self-assessment
    questionnaire we'd be filling in.
  skills: {required: [security_compliance], acceptable: [payments]}
  tools: {required: [search_knowledge], acceptable: [request_handoff]}
  first_action: [skill:security_compliance]
  note: >-
    Names Checkout and Elements but asks about PCI scope, so security_compliance with payments
    adjacent; the self-assessment is their own, not a Stripe document, so it is answered from cited
    docs and a security-team offer is optional.

- id: ss-register-30-states
  split: dev
  customer: seed:C002
  message: >-
    We now sell our software to businesses in about 30 US states. Do we need to register for sales
    tax in all of them?
  skills: {required: [tax], acceptable: []}
  tools: {required: [request_handoff], acceptable: [search_knowledge, remember]}
  first_action: [skill:tax]
  note: >-
    "Do we need to register" is tax by its trigger, but whether they are liable is tax advice, so
    the agent describes threshold monitoring and proposes the Tax Specialist.

