# Stripe Sales Copilot — Knowledge Graph
# ========================================
# Entities and relationships extracted from knowledge_base/*.md
# Used for query expansion and metadata enrichment in RAG pipeline.

entities:
  # ---- Product Lines ----
  product_line:
    - id: payment
      name: "Payment"
      description: "Online and in-person payment acceptance products"

    - id: revenue
      name: "Revenue"
      description: "Recurring billing, finance, and data products"

  # ---- Products ----
  product:
    # Payment Line
    - id: payments
      name: "Stripe Payments"
      product_line: payment
      summary: "Full payment processing platform — APIs, prebuilt UI, no-code tools"
      complexity: low

    - id: checkout
      name: "Stripe Checkout"
      product_line: payment
      summary: "Prebuilt, Stripe-hosted payment page — lowest engineering effort"
      complexity: low

    - id: payment_links
      name: "Stripe Payment Links"
      product_line: payment
      summary: "No-code shareable payment links — sell without a website"
      complexity: low

    - id: elements
      name: "Stripe Elements"
      product_line: payment
      summary: "Prebuilt UI components for fully custom checkout flows"
      complexity: high

    - id: payment_methods
      name: "Stripe Payment Methods"
      product_line: payment
      summary: "100+ global payment methods via unified API"
      complexity: low

    - id: terminal
      name: "Stripe Terminal"
      product_line: payment
      summary: "In-person payments with card readers and SDKs"
      complexity: medium

    - id: radar
      name: "Stripe Radar"
      product_line: payment
      summary: "AI-powered fraud detection and prevention"
      complexity: low

    - id: link
      name: "Stripe Link"
      product_line: payment
      summary: "Digital wallet for faster checkout with saved payment details"
      complexity: low

    - id: connect
      name: "Stripe Connect"
      product_line: payment
      summary: "Multi-party payments for platforms, marketplaces, and SaaS"
      complexity: high

    # Revenue Line
    - id: billing
      name: "Stripe Billing"
      product_line: revenue
      summary: "Recurring billing, subscription management, flexible pricing models"
      complexity: medium

    - id: subscriptions
      name: "Stripe Subscriptions"
      product_line: revenue
      summary: "Recurring payment plans with trials, proration, lifecycle management"
      complexity: medium

    - id: invoicing
      name: "Stripe Invoicing"
      product_line: revenue
      summary: "Invoice creation, accounts receivable automation, hosted invoice pages"
      complexity: low

    - id: tax
      name: "Stripe Tax"
      product_line: revenue
      summary: "Automated sales tax, VAT, and GST calculation and filing"
      complexity: medium

    - id: revenue_recognition
      name: "Stripe Revenue Recognition"
      product_line: revenue
      summary: "ASC 606 / IFRS 15 compliant automated revenue accounting"
      complexity: high

    - id: sigma
      name: "Stripe Sigma"
      product_line: revenue
      summary: "SQL-based custom reporting and analytics in the Dashboard"
      complexity: medium

    - id: data_pipeline
      name: "Stripe Data Pipeline"
      product_line: revenue
      summary: "No-code ETL to sync Stripe data with data warehouses"
      complexity: medium

  # ---- Payment Methods ----
  payment_method:
    - id: cards
      name: "Credit & Debit Cards"
      category: card
      regions: [global]

    - id: ach_debit
      name: "ACH Direct Debit"
      category: bank_debit
      regions: [us]

    - id: sepa_debit
      name: "SEPA Direct Debit"
      category: bank_debit
      regions: [eu]

    - id: bacs_debit
      name: "Bacs Direct Debit"
      category: bank_debit
      regions: [uk]

    - id: apple_pay
      name: "Apple Pay"
      category: wallet
      regions: [global]

    - id: google_pay
      name: "Google Pay"
      category: wallet
      regions: [global]

    - id: paypal
      name: "PayPal"
      category: wallet
      regions: [global]

    - id: alipay
      name: "Alipay"
      category: wallet
      regions: [cn, apac]

    - id: wechat_pay
      name: "WeChat Pay"
      category: wallet
      regions: [cn, apac]

    - id: klarna
      name: "Klarna"
      category: bnpl
      regions: [eu, us]

    - id: affirm
      name: "Affirm"
      category: bnpl
      regions: [us]

    - id: afterpay
      name: "Afterpay / Clearpay"
      category: bnpl
      regions: [us, eu, apac]

    - id: ideal
      name: "iDEAL"
      category: bank_redirect
      regions: [eu]

    - id: bancontact
      name: "Bancontact"
      category: bank_redirect
      regions: [eu]

    - id: sofort
      name: "Sofort"
      category: bank_redirect
      regions: [eu]

    - id: giropay
      name: "Giropay"
      category: bank_redirect
      regions: [eu]

    - id: przelewy24
      name: "Przelewy24"
      category: bank_redirect
      regions: [eu]

    - id: eps
      name: "EPS"
      category: bank_redirect
      regions: [eu]

    - id: fpx
      name: "FPX"
      category: bank_redirect
      regions: [apac]

    - id: grabpay
      name: "GrabPay"
      category: wallet
      regions: [apac]

    - id: boleto
      name: "Boleto"
      category: voucher
      regions: [latam]

    - id: oxxo
      name: "OXXO"
      category: voucher
      regions: [latam]

    - id: stablecoins
      name: "Stablecoins (USDC/USDT)"
      category: crypto
      regions: [global]

    - id: instant_bank_payments
      name: "Instant Bank Payments (Link)"
      category: bank_debit
      regions: [us]

  # ---- Sales Scenarios ----
  sales_scenario:
    - id: ecommerce
      name: "E-commerce Checkout"
      question_patterns:
        - "online store"
        - "sell online"
        - "shopping cart"
        - "ecommerce"
        - "online shop"

    - id: marketplace
      name: "Marketplace / Platform"
      question_patterns:
        - "marketplace"
        - "platform"
        - "seller"
        - "payout"
        - "multi-party"
        - "split payment"

    - id: saas_billing
      name: "SaaS Subscription Billing"
      question_patterns:
        - "saas"
        - "subscription"
        - "recurring"
        - "monthly billing"
        - "annual plan"
        - "software"

    - id: b2b_invoicing
      name: "B2B Invoicing"
      question_patterns:
        - "invoice"
        - "bill"
        - "b2b"
        - "net 30"
        - "payment terms"
        - "quote"

    - id: in_person
      name: "In-Person / POS"
      question_patterns:
        - "in person"
        - "pos"
        - "retail"
        - "store"
        - "card reader"
        - "tap to pay"
        - "point of sale"

    - id: fraud_prevention
      name: "Fraud Prevention"
      question_patterns:
        - "fraud"
        - "chargeback"
        - "risk"
        - "dispute"
        - "block"

    - id: global_expansion
      name: "Global Expansion / Multi-Currency"
      question_patterns:
        - "international"
        - "global"
        - "multi currency"
        - "europe"
        - "asia"
        - "local payment"

    - id: security_compliance
      name: "Security & Compliance Review"
      question_patterns:
        - "soc 2"
        - "pci"
        - "security"
        - "compliance"
        - "encryption"
        - "gdpr"
        - "penetration test"
        - "pen test"

    - id: pricing_negotiation
      name: "Pricing / Cost Discussion"
      question_patterns:
        - "pricing"
        - "discount"
        - "fees"
        - "cost"
        - "rate"
        - "custom price"

    - id: financial_reporting
      name: "Financial Reporting & Analytics"
      question_patterns:
        - "report"
        - "analytics"
        - "data"
        - "revenue report"
        - "sql"
        - "warehouse"
        - "dashboard"

    - id: no_code
      name: "No-Code / Low-Code Payments"
      question_patterns:
        - "no code"
        - "without coding"
        - "no developer"
        - "easy setup"
        - "quick start"
        - "link"

    - id: tax_compliance
      name: "Tax / VAT Compliance"
      question_patterns:
        - "tax"
        - "vat"
        - "gst"
        - "sales tax"
        - "tax calculation"
        - "tax filing"

    - id: escalation_request
      name: "Escalation Request"
      question_patterns:
        - "talk to human"
        - "talk to a human"
        - "talk to someone"
        - "speak to human"
        - "speak to agent"
        - "speak to someone"
        - "need a human"
        - "need a real person"
        - "real person"
        - "live agent"
        - "live person"
        - "not a bot"
        - "not an ai"
        - "connect me to"
        - "transfer me to"
        - "escalate this"
        - "escalate my"
        - "complaint"
        - "manager"
        - "supervisor"
        - "representative"

  # ---- Compliance Standards ----
  compliance:
    - id: pci_dss
      name: "PCI DSS Level 1"
    - id: soc1
      name: "SOC 1 Type II"
    - id: soc2
      name: "SOC 2 Type II"
    - id: soc3
      name: "SOC 3"
    - id: asc606
      name: "ASC 606"
    - id: ifrs15
      name: "IFRS 15"
    - id: gdpr
      name: "GDPR"
    - id: emvco
      name: "EMVCo Level 1 & 2"

  # ---- Geographies ----
  geography:
    - id: global
      name: "Global (135+ currencies)"
    - id: us
      name: "United States"
    - id: eu
      name: "Europe"
    - id: uk
      name: "United Kingdom"
    - id: apac
      name: "Asia-Pacific"
    - id: latam
      name: "Latin America"
    - id: cn
      name: "China"

  # ---- Customer Types ----
  customer_type:
    - id: startup
      name: "Startup (< $100K annual volume)"
    - id: growth
      name: "Growth ($100K - $1M annual volume)"
    - id: mid_market
      name: "Mid-Market ($1M - $10M annual volume)"
    - id: enterprise
      name: "Enterprise ($10M+ annual volume)"
    - id: strategic
      name: "Strategic ($100M+ annual volume)"

  # ---- Escalation Teams ----
  escalation_team:
    - id: deal_desk
      name: "Deal Desk / Pricing Team"
      triggers: [custom_pricing, discount_request]
    - id: security_team
      name: "Security & Compliance"
      triggers: [soc_request, security_review, penetration_test]
    - id: connect_specialist
      name: "Connect Specialist"
      triggers: [complex_connect, multi_party_flow]
    - id: sales_ops
      name: "Sales Ops / Human Agent"
      triggers: [talk_to_human, escalation_request]
    - id: enterprise_sales
      name: "Enterprise Sales"
      triggers: [strategic_deal, enterprise_contract]


