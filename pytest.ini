[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not eval"
markers =
    unit: Fast tests with no external dependencies (scripted provider, temp runtime DB)
    eval: The evaluation suite against the real provider; run with `pytest -m eval`
